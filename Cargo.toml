[package]
name = "cutmesh"
version = "0.1.0"
edition = "2021"
authors = ["Massimo Lauri"]
default-run = "cutmesh"
description = "Cutmesh — Encrypted P2P QUIC Tunnel & Distributed GGUF Layer Slicer for llama.cpp (ggml-rpc)"
license = "AGPL-3.0-only"

[[bin]]
name = "cutmesh"
path = "src/main.rs"

[dependencies]
iroh = "1.4.1"
tokio = { version = "1.40", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "signal"] }
blake3 = "1.5"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
